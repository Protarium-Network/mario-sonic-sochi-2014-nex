services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sochi2014
      POSTGRES_USER: sochi2014
      POSTGRES_PASSWORD: sochi2014
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sochi2014 -d sochi2014"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - sochi2014-postgres:/var/lib/postgresql/data

  nex:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PN_SOCHI2014_AUTH_PORT: "26000"
      PN_SOCHI2014_SECURE_PORT: "26001"
      PN_SOCHI2014_SECURE_HOST: ${PN_SOCHI2014_SECURE_HOST:-localhost}
      PN_SOCHI2014_POSTGRES_URI: postgres://sochi2014:sochi2014@postgres:5432/sochi2014?sslmode=disable
      PN_SOCHI2014_KERBEROS_PASSWORD: ${PN_SOCHI2014_KERBEROS_PASSWORD:-change-me}
      PN_SOCHI2014_LOCAL_MODE: "1"
      PN_SOCHI2014_SETTINGS_PATH: /home/go/app/settings.json
    ports:
      - "26000:26000/udp"
      - "26001:26001/udp"
    volumes:
      - ./settings.json:/home/go/app/settings.json:ro

volumes:
  sochi2014-postgres:
